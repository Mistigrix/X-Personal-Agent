# pnpm settings (this is a single-package repository, not a monorepo).

# Only these dependencies may run install scripts. better-sqlite3 needs one to
# fetch or build its native binding; everything else is blocked by default.
onlyBuiltDependencies:
  - better-sqlite3
  - esbuild

# Refuse package versions published less than 24 hours ago (supply-chain hygiene).
minimumReleaseAge: 1440

# Install scripts we deliberately never run. core-js@2 (pulled in by twitter-text)
# only prints a donation banner.
ignoredBuiltDependencies:
  - core-js
